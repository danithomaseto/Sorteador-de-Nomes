[project]
name = "sorteia-api"
version = "0.1.0"
description = "API do Sorteia: processa importações, sorteios e exportações apenas em memória."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1",
  "limits>=3.13",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-openpyxl>=3.1",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "C4", "PL", "N", "DTZ", "T20", "RET", "ARG",
]
ignore = [
  "PLR0913", # casos de uso recebem dependências explícitas
  "PLR2004", # números mágicos em limites são nomeados nos módulos de configuração
  "RUF001",  # textos em português usam travessões e aspas tipográficas
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004", "ARG001", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["limits.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "perf: testes de desempenho com listas grandes (10 a 50 mil participantes)",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  # O Starlette 1.x sugere trocar o httpx por outro cliente no TestClient; mantemos o httpx
  # (pacote oficial e amplamente auditado) até a migração ser avaliada.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
