# Produção (ou teste local do ambiente de produção):
#
#   cp .env.example .env      # ajuste SITE_ADDRESS
#   docker compose up -d --build
#
# Nenhum serviço guarda dados de usuário: não há banco de dados nem volumes para a API.
name: sorteia

services:
  api:
    build: ./backend
    image: sorteia-api
    restart: unless-stopped
    environment:
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      # A API só recebe conexões do Caddy (rede interna, sem porta publicada), então o
      # X-Forwarded-For enviado por ele é confiável e identifica o cliente no rate limit.
      FORWARDED_ALLOW_IPS: "*"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    networks: [interna]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    image: sorteia-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Apenas certificados TLS e estado interno do Caddy.
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    networks: [interna, publica]

networks:
  # Sem saída para a internet: a API nunca precisa chamar serviços externos.
  interna:
    internal: true
  publica: {}

volumes:
  caddy_data:
  caddy_config:
