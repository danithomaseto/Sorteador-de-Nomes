name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos, lint, formatação, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (navegador real, acessibilidade, privacidade, CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Build de produção
        run: npm ci && npm run build
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck && npm run format:check
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Serve o build como a Vercel (scripts/serve.mjs lê o vercel.json) e roda os testes.
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
